name: CMake Multi-Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Ubuntu (latest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake g++ \
          libgl-dev libglfw3-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
          libncurses-dev

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ubuntu-latest

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Verify binaries
      run: |
        test -f build/pex && echo "pex: OK"
        test -f build/pexc && echo "pexc: OK"

    - name: Run unit tests
      run: ./build/pex_tests

    - name: ccache stats
      run: ccache --show-stats

  build-debian:
    name: Debian (latest)
    runs-on: ubuntu-latest
    container: debian:latest

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          cmake g++ git pkg-config ccache \
          libgl-dev libglfw3-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
          libncurses-dev

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: debian-latest

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Verify binaries
      run: |
        test -f build/pex && echo "pex: OK"
        test -f build/pexc && echo "pexc: OK"

    - name: Run unit tests
      run: ./build/pex_tests

    - name: ccache stats
      run: ccache --show-stats

  # Windows TUI (pexc.exe) via MSYS2/UCRT64 + PDCursesMod. GUI is not built
  # on Windows; there is no native FreeBSD/Solaris-style VM needed since
  # windows-latest is a first-class GitHub runner.
  build-windows:
    name: Windows (TUI only)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v5

    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          git

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Verify binaries
      run: |
        test -f build/pexc.exe && echo "pexc.exe: OK"

  # macOS (Darwin) via the native macos-latest runner (Apple clang / libc++).
  # TUI + core for now (uses the SDK's ncurses); the Metal GUI is added later,
  # so GUI is off here. Also the C++23 (std::format) toolchain-floor check.
  build-macos:
    name: macOS (Metal GUI + TUI)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Verify binaries
      run: |
        test -f build/pex  && echo "pex (Metal GUI): OK"
        test -f build/pexc && echo "pexc (TUI): OK"

    - name: Run unit tests
      run: ./build/pex_tests

  # Clang build: catches GCC-isms and surfaces a different set of -Wall
  # -Wextra -Wpedantic diagnostics than the GCC jobs. Uses the system
  # libstdc++, so std::format etc. come from GCC's standard library.
  build-clang:
    name: Ubuntu (clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake clang \
          libgl-dev libglfw3-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
          libncurses-dev

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ubuntu-clang

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Verify binaries
      run: |
        test -f build/pex && echo "pex: OK"
        test -f build/pexc && echo "pexc: OK"

    - name: Run unit tests
      run: ./build/pex_tests

    - name: ccache stats
      run: ccache --show-stats

  # Oldest toolchain the C++23 code is expected to build on. std::format in
  # libstdc++ landed in GCC 13.1, so 13 is the presumed floor; if this job
  # fails, the real minimum is higher and this pin should be bumped.
  build-gcc-floor:
    name: GCC 13 (C++23 floor)
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake gcc-13 g++-13 \
          libgl-dev libglfw3-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
          libncurses-dev

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Verify binaries
      run: |
        test -f build/pex && echo "pex: OK"
        test -f build/pexc && echo "pexc: OK"

    - name: Run unit tests
      run: ./build/pex_tests

  # AddressSanitizer + UndefinedBehaviorSanitizer over the platform-neutral
  # core and its unit tests. Only pex_tests (and pex_core) are built and run
  # — no GUI/TUI/platform providers — so this is a fast, dependency-light
  # check for UB and memory errors in the core logic.
  sanitizers:
    name: Sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=1

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++

    - name: Configure
      run: >
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_GUI=OFF -DBUILD_TUI=OFF
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build tests
      run: cmake --build build --target pex_tests -j$(nproc)

    - name: Run tests under sanitizers
      run: ./build/pex_tests

  # musl libc portability (TUI + core only; the GL stack is skipped). Built
  # inside an Alpine container via docker run so actions/checkout still runs
  # on the glibc host — GitHub's bundled node cannot execute under musl.
  build-alpine-musl:
    name: Alpine (musl, TUI)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Build and test in Alpine
      run: |
        docker run --rm -v "$PWD:/src" -w /src alpine:latest sh -c '
          set -e
          apk add --no-cache build-base cmake git linux-headers ncurses-dev
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF
          cmake --build build -j$(nproc)
          test -f build/pexc && echo "pexc: OK"
          ./build/pex_tests
        '

  build-freebsd:
    name: FreeBSD (latest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Build on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg install -y \
            cmake git pkgconf ccache \
            glfw mesa-libs mesa-devel libglvnd \
            libX11 libXrandr libXinerama libXcursor libXi xorgproto \
            ncurses
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j$(sysctl -n hw.ncpu)
          test -f build/pex && echo "pex: OK"
          test -f build/pexc && echo "pexc: OK"
          ./build/pex_tests
          ccache --show-stats

  build-solaris:
    name: Solaris x86 (latest)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Build on Solaris
      uses: vmactions/solaris-vm@v1
      with:
        prepare: |
          pkg install developer/gcc || true
          pkg install developer/versioning/git || true
          pkg install developer/build/cmake || true
          pkg install developer/build/gnu-make || true
          pkg install system/header || true
          pkg install x11/header || true
          pkg install x11/library/libx11 || true
          pkg install x11/library/libxrandr || true
          pkg install x11/library/libxinerama || true
          pkg install x11/library/libxcursor || true
          pkg install x11/library/libxi || true
          pkg install library/mesa || true
        run: |
          export PATH="/usr/gcc/*/bin:$PATH"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_NCURSES=ON
          cmake --build build -j$(psrinfo -p)
          test -f build/pex && echo "pex: OK"
          test -f build/pexc && echo "pexc: OK"
          ./build/pex_tests
